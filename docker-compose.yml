services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: meeting-ops-db
    environment:
      POSTGRES_DB: meeting_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./meeting-service/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meeting_ops"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Centralized API Gateway Rate Limiting & Distributed Caching
  redis:
    image: redis:7.2-alpine
    container_name: meeting-ops-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Kafka (via KRaft mode)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: meeting-ops-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list
      interval: 30s
      timeout: 10s
      retries: 5

  # Automated Kafka Partitioned Topic & DLQ Provisioning
  kafka-init-topics:
    image: confluentinc/cp-kafka:7.6.0
    container_name: meeting-ops-kafka-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      # Create partitioned topics (3 partitions each)
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic meeting.captured --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic meeting.captured.DLQ --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic meeting.transcribed --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic meeting.transcribed.DLQ --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic meeting.extracted --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic meeting.extracted.DLQ --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic draft.created --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic draft.created.DLQ --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic action.decided --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic action.decided.DLQ --partitions 3 --replication-factor 1
      
      echo 'Successfully provisioned all 5 core partitioned topics and 5 DLQ topics.'
      "

  # Spring Cloud API Gateway (Port 8080)
  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    container_name: meeting-ops-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      MEETING_SERVICE_URL: http://meeting-service:8081
      REVIEW_SERVICE_URL: http://review-service:8083
      MCP_SERVICE_URL: http://mcp-service:8084
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-https://auth.meetingops.example.com}
      OAUTH2_JWK_URI: ${OAUTH2_JWK_URI:-https://auth.meetingops.example.com/.well-known/jwks.json}
    depends_on:
      - meeting-service
      - review-service
      - mcp-service
      - redis

  # Meeting Service
  meeting-service:
    build:
      context: .
      args:
        MODULE: meeting-service
    container_name: meeting-ops-meeting-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/meeting_ops
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-https://auth.meetingops.example.com}
      OAUTH2_JWK_URI: ${OAUTH2_JWK_URI:-https://auth.meetingops.example.com/.well-known/jwks.json}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # AI Pipeline Service
  ai-pipeline-service:
    build:
      context: .
      args:
        MODULE: ai-pipeline-service
    container_name: meeting-ops-ai-pipeline-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/meeting_ops
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MCP_SERVER_URL: http://mcp-service:8084/mcp
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-https://auth.meetingops.example.com}
      OAUTH2_JWK_URI: ${OAUTH2_JWK_URI:-https://auth.meetingops.example.com/.well-known/jwks.json}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mcp-service:
        condition: service_started

  # Review Service
  review-service:
    build:
      context: .
      args:
        MODULE: review-service
    container_name: meeting-ops-review-service
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/meeting_ops
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-https://auth.meetingops.example.com}
      OAUTH2_JWK_URI: ${OAUTH2_JWK_URI:-https://auth.meetingops.example.com/.well-known/jwks.json}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # FastMCP Service
  mcp-service:
    build:
      context: ./mcp-service
      dockerfile: Dockerfile
    container_name: meeting-ops-mcp-service
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084

  # Ephemeral MinIO Object Storage (24h Auto-Purge TTL - NFR-4.2)
  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: meeting-ops-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"

  # Automated 24h Bucket Retention & S3 Lifecycle Rule
  minio-init-bucket:
    image: minio/mc:RELEASE.2024-04-18T16-45-29Z
    container_name: meeting-ops-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/meeting-audio-recordings;
      /usr/bin/mc ilm rule add --expire-days 1 local/meeting-audio-recordings;
      exit 0;
      "

  # Capture Service (Port 8085) - Phase 2 (Week 3)
  capture-service:
    build:
      context: ./capture-service
      dockerfile: Dockerfile
    container_name: meeting-ops-capture-service
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: meeting_ops
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_AUDIO: meeting-audio-recordings
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      BOT_PROVIDER_API_KEY: ${BOT_PROVIDER_API_KEY:-mock_key}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  pgdata:
  miniodata:
