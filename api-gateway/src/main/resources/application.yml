server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: meeting-service
          uri: ${MEETING_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/meetings/**

        - id: review-service
          uri: ${REVIEW_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/review-queue/**, /api/v1/draft-actions/**

        - id: mcp-service
          uri: ${MCP_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/mcp/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
